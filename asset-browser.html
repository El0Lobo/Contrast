<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Asset browser | Contrast</title>
  <link rel="icon" href="assets/icons/site/favicon.ico">
  <link rel="stylesheet" href="assets/css/asset-browser.css">
  <!-- CSP_PLACEHOLDER -->
</head>
<body>
  <header class="asset-header">
    <a class="asset-brand" href="./" aria-label="Back to Contrast">
      <img src="assets/images/logo-wordmark.webp" alt="Contrast">
    </a>
    <div>
      <p class="asset-eyebrow">Internal library</p>
      <h1>Asset browser</h1>
    </div>
    <p class="asset-count" aria-live="polite"><strong id="visible-count">0</strong> assets</p>
  </header>

  <main>
    <section class="asset-toolbar" aria-label="Asset filters">
      <label class="asset-search">
        <span class="sr-only">Search assets</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="asset-search" type="search" placeholder="Search by name, folder or type…" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </section>
    <section class="asset-type-row" aria-label="File type filters">
      <div class="asset-filters" role="group" aria-label="File type">
        <button class="is-active" type="button" data-filter="all">All</button>
        <button type="button" data-filter="image">Images</button>
        <button type="button" data-filter="icon">Icons</button>
        <button type="button" data-filter="code">Code</button>
        <button type="button" data-filter="document">Documents</button>
        <button type="button" data-filter="metadata">Other</button>
      </div>
    </section>

    <p id="asset-status" class="asset-status" aria-live="polite"></p>
    <section id="asset-grid" class="asset-grid" aria-label="Assets"></section>
    <div id="asset-empty" class="asset-empty" hidden>
      <p>No matching assets.</p>
      <button type="button">Clear search</button>
    </div>
  </main>

  <template id="asset-card-template">
    <article class="asset-card">
      <button class="asset-preview" type="button" aria-label="">
        <span class="asset-file-icon" aria-hidden="true"></span>
      </button>
      <div class="asset-info">
        <p class="asset-name"></p>
        <p class="asset-path"></p>
      </div>
      <div class="asset-card-actions">
        <button class="asset-copy" type="button">Copy path</button>
        <a class="asset-download" download>Download</a>
      </div>
    </article>
  </template>

  <dialog id="asset-dialog">
    <button class="dialog-close" type="button" aria-label="Close preview">×</button>
    <div class="dialog-preview"></div>
    <div class="dialog-info">
      <p class="dialog-type"></p>
      <h2 class="dialog-name"></h2>
      <p class="dialog-path"></p>
      <div class="dialog-actions">
        <button class="dialog-copy" type="button">Copy path</button>
        <a class="dialog-download" download>Download</a>
        <a class="dialog-open" target="_blank" rel="noopener">Open original ↗</a>
      </div>
    </div>
  </dialog>

  <script src="assets/js/asset-manifest.js"></script>
  <script src="assets/js/asset-browser.js"></script>
</body>
</html>
