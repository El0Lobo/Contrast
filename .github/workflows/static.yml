# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          check-latest: true
          package-manager-cache: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build static site
        run: node scripts/build-clean-routes.mjs
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/Queer-Kneipe/index.html
          test -f dist/Das-Labor/index.html
          test -f dist/Punk-Kneipe/index.html
          test -f dist/Info-Kneipe/index.html
          test -f dist/Kunst-Kneipe/index.html
          test -f dist/Spieleabend/index.html
          test -f dist/mitglied/index.html
          test -f dist/Kontakt/index.html
          test -f dist/About/index.html
          test -f dist/Archiv/index.html
          test -f dist/events/velvet-rupture/index.html
          test -f dist/en/index.html
          test -f dist/en/About/index.html
          test -f dist/en/Archiv/index.html
          test -f dist/en/Queer-Kneipe/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
